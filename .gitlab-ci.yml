stages: [lint, build]

default:
  image: debian:bookworm-slim
  tags: [linux]
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends ca-certificates curl git g++
    - curl -fsSL https://github.com/jdx/mise/releases/download/v2026.11.8/mise-v2026.11.8-linux-x64.tar.gz | tar -xz --strip-components=2 -C /usr/local/bin mise/bin/mise
    - mise trust mise.toml
    - mise install

lint:
  stage: lint
  script:
    - mise run lint
    - git diff --exit-code -- skins

build:
  stage: build
  script:
    - mise run test
    - apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix
    - mise exec -- cmake -S . -B build-cross -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DPHONE_MONITOR_BUILD_RUNTIME=ON -DCMAKE_BUILD_TYPE=Release
    - mise exec -- cmake --build build-cross
    - mise run setup
    - mise exec -- uv run --frozen python tools/package.py --build-dir build-cross
  artifacts:
    paths: [dist/]
    expire_in: 14 days

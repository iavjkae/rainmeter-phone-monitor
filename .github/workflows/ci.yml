name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - run: mise run lint

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, mingw]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.compiler == 'msvc'
      - name: Select compiler
        shell: pwsh
        run: |
          if ('${{ matrix.compiler }}' -eq 'msvc') { 'CXX=cl' >> $env:GITHUB_ENV }
          else { 'CXX=g++' >> $env:GITHUB_ENV }
      - run: mise run test
      - run: mise run smoke
      - run: mise run package
      - uses: actions/upload-artifact@v4
        with:
          name: phone-monitor-${{ matrix.compiler }}
          path: dist/

; UTF-8. Personal overrides belong in FPSBridge.local.ini (not tracked or packaged).
[Paths]
PresentMon=PresentMon.exe
StateFile=fps-state.txt

[Selection]
; Semicolon-separated executable name patterns; supports * and ? (ASCII case-insensitive).
; Empty lists apply no process-name filtering. Exclusion takes precedence over inclusion.
Include=
Exclude=
ForegroundOnly=1

[Capture]
SessionName=RainmeterPhoneFPS
UpdateIntervalMs=1000
UnloadGraceMs=30000

[History]
RecentWindowMs=1500
HistoryWindowMs=30000
StreamStaleMs=2500
MinimumSamples=3
MaxStreams=64
MaxFramesPerStream=120000

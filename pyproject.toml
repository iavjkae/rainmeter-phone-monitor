[project]
name = "rainmeter-phone-monitor"
version = "0.1.0"
description = "Modern Rainmeter hardware-monitor skins for a phone secondary display"
requires-python = ">=3.10"
license = "MIT"

[dependency-groups]
dev = ["ruff==0.14.4", "clang-format==21.1.0", "cmakelang==0.6.13", "PyYAML==6.0.3"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
